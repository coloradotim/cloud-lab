[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloud-lab-backend"
version = "0.1.0"
description = "FastAPI backend and simulation core for Cloud Lab."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "mypy>=1.11.0",
  "pytest>=8.3.0",
  "ruff>=0.6.0",
]
pysdm-eval = [
  "PySDM>=2.131,<3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "smoke: fast smoke coverage for API, schema, and basic solver contracts",
  "science: scientific validation checks that are valuable but slower than the default PR path",
  "slow: long-running checks reserved for full or heavy validation tiers",
  "boussinesq: checks for the Boussinesq 2-D solver and its diagnostics",
  "pysdm: optional PySDM evaluation smoke checks",
  "validation: reference-case or benchmark validation checks",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = []
