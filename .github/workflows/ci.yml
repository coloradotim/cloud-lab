name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      targeted_science: ${{ steps.filter.outputs.targeted_science }}
      run_all_quick: ${{ steps.filter.outputs.run_all_quick }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "schedule" ]]; then
            {
              echo "backend=true"
              echo "frontend=true"
              echo "targeted_science=true"
              echo "run_all_quick=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
          fi

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            changed_files="$(git ls-files)"
          else
            changed_files="$(git diff --name-only "$base_sha" "$head_sha")"
          fi

          echo "Changed files:"
          printf '%s\n' "$changed_files"

          backend=false
          frontend=false
          targeted_science=false
          run_all_quick=false

          if printf '%s\n' "$changed_files" | grep -Eq '^(\.github/workflows/ci\.yml|backend/|scripts/)'; then
            backend=true
          fi

          if printf '%s\n' "$changed_files" | grep -Eq '^(\.github/workflows/ci\.yml|frontend/)'; then
            frontend=true
          fi

          if printf '%s\n' "$changed_files" | grep -Eq '^(\.github/workflows/ci\.yml|backend/app/sim/(boussinesq_2d|microphysics_|pysdm_|validation|presets|solver|structured_fields)|backend/tests/test_(boussinesq|microphysics|pysdm|presets|solver)|docs/(boussinesq|microphysics|pysdm|scenarios|scientific-roadmap|testing-and-validation))'; then
            targeted_science=true
          fi

          if [[ "${{ github.event_name }}" == "push" ]]; then
            run_all_quick=true
            backend=true
            frontend=true
          fi

          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "targeted_science=$targeted_science"
            echo "run_all_quick=$run_all_quick"
          } >> "$GITHUB_OUTPUT"

  fast-backend:
    name: Backend quick
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Report skipped backend quick checks
        if: needs.changes.outputs.backend != 'true' && needs.changes.outputs.run_all_quick != 'true'
        run: echo "Backend quick checks skipped; no backend or shared CI paths changed."

      - name: Check out repository
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.run_all_quick == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.run_all_quick == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.run_all_quick == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run backend quick tests
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.run_all_quick == 'true'
        working-directory: backend
        run: pytest -m "not slow and not science and not validation and not pysdm"

      - name: Check backend formatting
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.run_all_quick == 'true'
        working-directory: backend
        run: ruff format --check .

      - name: Lint backend
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.run_all_quick == 'true'
        working-directory: backend
        run: ruff check .

      - name: Type check backend
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.run_all_quick == 'true'
        working-directory: backend
        run: mypy app tests

  targeted-science:
    name: Targeted solver/science
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Report skipped targeted science checks
        if: needs.changes.outputs.targeted_science != 'true' && needs.changes.outputs.run_all_quick != 'true'
        run: echo "Targeted solver/science checks skipped; no solver, science, or validation paths changed."

      - name: Check out repository
        if: needs.changes.outputs.targeted_science == 'true' || needs.changes.outputs.run_all_quick == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: needs.changes.outputs.targeted_science == 'true' || needs.changes.outputs.run_all_quick == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        if: needs.changes.outputs.targeted_science == 'true' || needs.changes.outputs.run_all_quick == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run targeted Boussinesq and microphysics checks
        if: needs.changes.outputs.targeted_science == 'true' || needs.changes.outputs.run_all_quick == 'true'
        working-directory: backend
        run: pytest -m "(boussinesq or microphysics) and not slow and not pysdm"

  science-validation:
    name: Science validation
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run short Boussinesq science checks
        working-directory: backend
        run: pytest -m "science and not slow"

      - name: Run full Boussinesq validation checks
        working-directory: backend
        run: pytest -m "science and validation"

  frontend:
    name: Frontend quick
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Report skipped frontend quick checks
        if: needs.changes.outputs.frontend != 'true' && needs.changes.outputs.run_all_quick != 'true'
        run: echo "Frontend quick checks skipped; no frontend or shared CI paths changed."

      - name: Check out repository
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.run_all_quick == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.run_all_quick == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.run_all_quick == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.run_all_quick == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.run_all_quick == 'true'
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.run_all_quick == 'true'
        working-directory: frontend
        run: npm run build

  ci-required:
    name: CI required
    needs: [changes, fast-backend, targeted-science, frontend]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Summarize required checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_RESULT: ${{ needs.fast-backend.result }}
          TARGETED_SCIENCE_RESULT: ${{ needs.targeted-science.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          echo "changes: $CHANGES_RESULT"
          echo "backend quick: $BACKEND_RESULT"
          echo "targeted solver/science: $TARGETED_SCIENCE_RESULT"
          echo "frontend quick: $FRONTEND_RESULT"

          if [[ "$CHANGES_RESULT" != "success" || "$BACKEND_RESULT" != "success" || "$TARGETED_SCIENCE_RESULT" != "success" || "$FRONTEND_RESULT" != "success" ]]; then
            exit 1
          fi
